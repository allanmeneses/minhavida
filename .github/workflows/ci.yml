name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Testes da API
        working-directory: backend
        run: dotnet test --nologo

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar o app
        working-directory: app
        run: npm ci
      - name: Testes do app
        working-directory: app
        run: npm test
      - name: Checagem TypeScript
        working-directory: app
        run: npx tsc --noEmit
      - name: Instalar Playwright
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Playwright web
        working-directory: app
        env:
          CI: '1'
          Database__Provider: Sqlite
          ConnectionStrings__Default: Data Source=/tmp/circulos-ci.db
          EXPO_PUBLIC_API_URL: http://127.0.0.1:5288
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:43123
          E2E_ARTIFACTS: test-results/e2e
        run: npx playwright test
      - name: Relatorio Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
