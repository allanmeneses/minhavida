name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  Database__Provider: Postgres
  ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=circulos;Username=circulos;Password=circulos
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: '5432'
  POSTGRES_USER: circulos
  POSTGRES_PASSWORD: circulos

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: circulos
          POSTGRES_PASSWORD: circulos
          POSTGRES_DB: circulos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circulos -d circulos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Testes da API
        working-directory: backend
        run: dotnet test --nologo

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: circulos
          POSTGRES_PASSWORD: circulos
          POSTGRES_DB: circulos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circulos -d circulos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar o app
        working-directory: app
        run: npm ci
      - name: Testes do app
        working-directory: app
        run: npm test
      - name: Checagem TypeScript
        working-directory: app
        run: npx tsc --noEmit
      - name: Instalar Playwright
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Playwright web
        working-directory: app
        env:
          CI: '1'
          EXPO_PUBLIC_API_URL: http://127.0.0.1:5288
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:43123
          E2E_ARTIFACTS: test-results/e2e
        run: npx playwright test
      - name: Relatorio Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Pacotes do SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - name: Instalar o app
        working-directory: app
        run: npm ci
      - name: Prebuild Android
        working-directory: app
        env:
          CI: '1'
        run: npx expo prebuild --platform android
      - name: Gerar APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: circulos-android
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
