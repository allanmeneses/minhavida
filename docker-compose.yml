services:
  postgres:
    image: postgres:16-alpine
    container_name: circulos-postgres
    environment:
      POSTGRES_USER: circulos
      POSTGRES_PASSWORD: circulos
      POSTGRES_DB: circulos
    ports:
      - "5432:5432"
    volumes:
      - circulos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circulos -d circulos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  circulos_pgdata:
